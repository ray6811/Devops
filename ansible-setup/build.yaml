- name: Deploy Microservice to GCP Artifact Registry
  hosts: localhost
  become: yes
  vars_files:
    - vars.yml
    - vault.yml
  tasks:
    - name: Ensure required packages are installed
      package:
        name: [git, zip]
        state: present
    - name: Clone the React repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: main
        force: yes
    - name: Fail if service_name is not provided
      fail:
        msg: "Please provide the service_name using -e 'service_name=servicename'"
      when: service_name is not defined
    - name: Set working directory for the service
      set_fact:
        service_dir: "{{ project_path }}/src/{{ service_name }}"
        full_image_name: "{{ gcp_region }}-docker.pkg.dev/{{ gcp_project_id }}/{{ repo_name }}/{{ service_name }}:{{ image_tag }}"
    - name: Check if service directory exists
      stat:
        path: "{{ service_dir }}"
      register: service_dir_stat
    - name: Fail if service directory does not exist
      fail:
        msg: "Service directory {{ service_dir }} not found!"
      when: not service_dir_stat.stat.exists
    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ full_image_name }}"
        source: build
        build:
          path: "{{ service_dir }}"
        push: false
    - name: Run deployment shell script
      shell: |
        ./deploy.sh "{{ service_name }}" "{{ gcp_key_path }}" "{{ gcp_project_id }}" "{{ gcp_region }}" "{{ repo_name }}" "{{ image_tag }}" "{{ CLUSTER_ZONE }}" "{{ CLUSTER_NAME }}"
      args:
        chdir: "{{ playbook_dir }}"