pipeline:
  agent any
  tools:
    nodejs: "nodejs-global"

  stages:
    - stage: Checkout
      steps:
        - git url: 'https://github.com/ray6811/Wanderlust-Mega-Project.git'

    - stage: Install & Build
      steps:
        - sh 'npm install'
        - sh 'npm run build'
      args:
        chdir: "{{ project_path }}"

    
