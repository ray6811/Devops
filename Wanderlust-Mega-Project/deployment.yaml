---
- name: Build Wanderlust-Mega-Project Frontend Locally
  hosts: localhost
  become: yes

  vars:
    repo_url: https://github.com/ray6811/Wanderlust-Mega-Project.git
    project_path: /opt

  tasks:
    - name: Clone the React repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: main
        force: yes

    - name: Install frontend dependencies
      shell: |
        source /home/jenkins/.nvm/nvm.sh
        cd {{ project_path }}/frontend
        npm install
      args:
        executable: /bin/bash
      become: yes

    - name: Build React frontend
      shell: |
        source /home/jenkins/.nvm/nvm.sh
        cd {{ project_path }}/frontend
        npm run build
      args:
        executable: /bin/bash
      become: yes

# ---------------- Deployment Play ----------------
- name: Deploy frontend build to remote servers
  hosts: webservers          # Group from your inventory file
  become: yes
  remote_user: azureuser     # Use Jenkins user
  vars:
    local_build_path: /opt/frontend/dist  # adjust if your build folder is 'build'
    deploy_path: /var/www/

  tasks:
    - name: Remove existing deployment directory (if any)
    file:
      path: "{{ deploy_path }}/*"
      state: absent
    become: yes
    
    - name: Ensure deployment directory exists on remote
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Copy frontend build to remote server
      copy:
        src: "{{ local_build_path }}/"
        dest: "{{ deploy_path }}/"
        owner: root
        group: root
        mode: '0755'
        remote_src: no

    
