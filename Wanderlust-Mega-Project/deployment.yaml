---
- name: Build & Deploy Wanderlust-Mega-Project Frontend 
  hosts: localhost
  become: no

  vars:
    repo_url: https://github.com/ray6811/Wanderlust-Mega-Project.git
    project_path: /opt
    
  tasks:
    - name: Clone the React repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_path }}"
        version: main
        force: yes

    - name: Install frontend dependencies
      shell: |
        source /home/jenkins/.nvm/nvm.sh
        cd {{ project_path }}/frontend
        npm install
      args:
        executable: /bin/bash
      become: no

      

    - name: Build React app
      command: npm run build
      become: yes
      args:
        chdir: "{{ project_path }}/frontend/"
      

    

    
